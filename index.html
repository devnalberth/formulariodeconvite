<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Convite</title>

  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="projeto">
    <aside class="brand">
      <div class="brand-content">
        <img src="assets/icons/Logo.svg" alt="Logo do convite" class="brand-icon">
        <h2 class="brand-name">Festivite</h2>
        <p class="brand-description">Crie um convite digital para o seu evento</p>
      </div>
    </aside>
    <main class="invite">
      <div class="invite-content">
        <h1>Crie seu convite</h1>
        <p>Preencha os campos abaixo para criar seu convite digital.</p>
      </div>
    </main>
  </div>
</body>
</html>
